<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Simulator PRO</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0B10; color: #E0E6ED; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.35); border-radius: 2px; }
    .neon-cyan { text-shadow: 0 0 10px #06b6d4; }
    @keyframes pulse-once { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .animate-pulse-once { animation: pulse-once 0.5s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─── Utility ──────────────────────────────────────────────────────── */
    const cn = (...args) => args.flat().filter(Boolean).join(' ');

    /* ─── SVG Icons (Lucide-compatible) ───────────────────────────────── */
    const SvgIcon = ({ children, className = 'w-5 h-5', ...p }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" strokeLinecap="round"
           strokeLinejoin="round" className={className} {...p}>
        {children}
      </svg>
    );
    const Cpu = p => <SvgIcon {...p}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="4"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="2" y1="9" x2="4" y2="9"/><line x1="2" y1="15" x2="4" y2="15"/><line x1="20" y1="9" x2="22" y2="9"/><line x1="20" y1="15" x2="22" y2="15"/></SvgIcon>;
    const Server = p => <SvgIcon {...p}><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></SvgIcon>;
    const Network = p => <SvgIcon {...p}><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="16" y="2" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><path d="M5 8v4M5 16v-4M19 8v4M19 16v-4M8 5h4M16 5h-4M8 19h4M16 19h-4"/></SvgIcon>;
    const ShieldAlert = p => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></SvgIcon>;
    const Laptop = p => <SvgIcon {...p}><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></SvgIcon>;
    const Play = p => <SvgIcon {...p}><polygon points="5 3 19 12 5 21 5 3"/></SvgIcon>;
    const Pause = p => <SvgIcon {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></SvgIcon>;
    const SkipBack = p => <SvgIcon {...p}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></SvgIcon>;
    const SkipFwd = p => <SvgIcon {...p}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></SvgIcon>;
    const RotateCcw = p => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Plus = p => <SvgIcon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>;
    const Trash2 = p => <SvgIcon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SvgIcon>;
    const Database = p => <SvgIcon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></SvgIcon>;
    const HardDrive = p => <SvgIcon {...p}><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></SvgIcon>;
    const Zap = p => <SvgIcon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></SvgIcon>;
    const AlertTriangle = p => <SvgIcon {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></SvgIcon>;

    /* ═══════════════════════════════════════════════════════════════════════
       CPU SCHEDULING
    ═══════════════════════════════════════════════════════════════════════ */
    const ALGOS = ['FCFS','SJF','SRTF','RR','Priority','Preemptive Priority'];

    function CPUScheduling() {
      const [procs, setProcs] = useState([
        {id:'p1',arrival:3,burst:10,priority:1,remaining:10,state:'New'},
        {id:'p2',arrival:1,burst:1, priority:1,remaining:1, state:'New'},
        {id:'p3',arrival:5,burst:2, priority:1,remaining:2, state:'New'},
        {id:'p4',arrival:4,burst:4, priority:1,remaining:4, state:'New'},
        {id:'p5',arrival:2,burst:5, priority:1,remaining:5, state:'New'},
      ]);
      const [algo, setAlgo]         = useState('FCFS');
      const [quantum, setQuantum]   = useState(2);
      const [gantt, setGantt]       = useState([]);
      const [stats, setStats]       = useState([]);
      const [zoom, setZoom]         = useState(100);
      const [tick, setTick]         = useState(0);
      const [playing, setPlaying]   = useState(false);
      const [simMax, setSimMax]     = useState(0);

      useEffect(() => {
        let iv;
        if (playing && tick < simMax) { iv = setInterval(() => setTick(t => t + 1), 500); }
        else if (tick >= simMax) setPlaying(false);
        return () => clearInterval(iv);
      }, [playing, tick, simMax]);

      useEffect(() => {
        if (!simMax || !gantt.length) return;
        setProcs(ps => ps.map(p => {
          let ns = p.state;
          if (tick < p.arrival) { ns = 'New'; }
          else {
            const st = stats.find(s => s.id === p.id);
            if (st?.completion <= tick) { ns = 'Terminated'; }
            else {
              const rb = gantt.find(b => b.start <= tick && b.end > tick);
              ns = rb?.id === p.id ? 'Running' : 'Ready';
            }
          }
          return ns !== p.state ? {...p, state: ns} : p;
        }));
      }, [tick]);

      const addProc = () => {
        const id = `p${procs.length+1}`;
        setProcs([...procs, {id, arrival:0, burst:1, priority:1, remaining:1, state:'New'}]);
      };
      const delProc = i => setProcs(procs.filter((_,idx) => idx !== i));
      const upd = (i, f, v) => {
        const a = [...procs];
        a[i] = {...a[i], [f]: v};
        if (f === 'burst') a[i].remaining = v;
        setProcs(a);
      };

      const simulate = () => {
        let ps = procs.map(p => ({...p, remaining: p.burst}));
        let time=0, done=0, run=null, qSpent=0, queue=[], _g=[];
        while (done < ps.length && time < 5000) {
          ps.filter(p => p.arrival === time).forEach(p => queue.push(p.id));
          if (run) {
            const pr = ps.find(p => p.id === run);
            if (pr.remaining === 0) { pr.completion = time; done++; run = null; qSpent = 0; }
          }
          if (run) {
            const pr = ps.find(p => p.id === run);
            let preempt = false;
            if (algo === 'RR' && qSpent === quantum) { preempt = true; queue.push(run); }
            else if (algo === 'SRTF') {
              for (const q of queue) { const p = ps.find(x => x.id === q); if (p.remaining < pr.remaining) { preempt = true; queue.push(run); break; } }
            } else if (algo === 'Preemptive Priority') {
              for (const q of queue) { const p = ps.find(x => x.id === q); if (p.priority < pr.priority) { preempt = true; queue.push(run); break; } }
            }
            if (preempt) { run = null; qSpent = 0; }
          }
          if (!run && queue.length) {
            if (algo === 'FCFS' || algo === 'RR') { run = queue.shift(); }
            else if (algo === 'SJF' || algo === 'SRTF') {
              let bi = 0;
              for (let i=1; i<queue.length; i++) if (ps.find(p=>p.id===queue[i]).remaining < ps.find(p=>p.id===queue[bi]).remaining) bi=i;
              run = queue[bi]; queue.splice(bi,1);
            } else {
              let bi = 0;
              for (let i=1; i<queue.length; i++) if (ps.find(p=>p.id===queue[i]).priority < ps.find(p=>p.id===queue[bi]).priority) bi=i;
              run = queue[bi]; queue.splice(bi,1);
            }
            qSpent = 0;
          }
          if (run) {
            const pr = ps.find(p => p.id === run);
            const last = _g[_g.length-1];
            if (!last || last.id !== run) _g.push({id:run, start:time, end:time+1, priority:pr.priority, remStart:pr.remaining, remEnd:pr.remaining-1});
            else { last.end = time+1; last.remEnd = pr.remaining-1; }
            pr.remaining--; qSpent++;
          } else if (done < ps.length) {
            const last = _g[_g.length-1];
            if (!last || last.id !== 'Idle') _g.push({id:'Idle', start:time, end:time+1});
            else last.end = time+1;
          }
          time++;
        }
        setGantt(_g); setStats(ps); setSimMax(time); setTick(0); setPlaying(true);
      };

      const blockColor = id => {
        if (id === 'Idle') return 'bg-gray-600 border-gray-500 text-gray-200';
        const n = parseInt(id.replace(/\D/g,'')) || 0;
        return ['bg-blue-500','bg-red-500','bg-emerald-500','bg-purple-500','bg-amber-500','bg-indigo-500','bg-pink-500','bg-teal-500'][n % 8] + ' border-white/20 text-white';
      };

      const visGantt = gantt.filter(b => b.start < tick).map(b => ({...b, end: Math.min(b.end, tick)}));
      const doneStats = stats.filter(p => p.completion !== undefined && p.completion <= tick);
      let avgTurn = 0, avgWait = 0;
      if (doneStats.length) {
        avgTurn = doneStats.reduce((a,p) => a + (p.completion - p.arrival), 0) / doneStats.length;
        avgWait = doneStats.reduce((a,p) => a + (p.completion - p.arrival - p.burst), 0) / doneStats.length;
      }

      const stateBadge = state => cn(
        'px-3 py-1 rounded-full text-xs font-bold border',
        state === 'Running'    ? 'text-amber-400 border-amber-500/50 bg-amber-500/10' :
        state === 'Ready'      ? 'text-cyan-400 border-cyan-500/30 bg-cyan-500/10' :
        state === 'Terminated' ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' :
                                  'text-gray-400 border-white/10 bg-white/5'
      );

      return (
        <div className="space-y-6">
          {/* Process Table */}
          <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            <h3 className="text-xs font-bold uppercase tracking-widest text-[#E0E6ED] mb-4">Process Table</h3>
            <div className="overflow-x-auto custom-scrollbar">
              <table className="w-full text-left border-collapse min-w-[600px]">
                <thead>
                  <tr className="border-b border-white/10">
                    {['ID','Arrival','Burst','Priority (1=High)','State',''].map((h,i)=>(
                      <th key={i} className="py-3 px-4 font-semibold text-xs text-gray-500 tracking-wider">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {procs.map((p,i) => (
                    <tr key={i} className="border-b border-white/5 hover:bg-white/5 transition">
                      <td className="py-2 px-4 font-mono text-[#E0E6ED]">{p.id}</td>
                      <td className="py-2 px-4"><input type="number" className="w-20 bg-black/50 border border-white/10 rounded-md px-3 py-1.5 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={p.arrival} onChange={e=>upd(i,'arrival',+e.target.value)} /></td>
                      <td className="py-2 px-4"><input type="number" min={1} className="w-20 bg-black/50 border border-white/10 rounded-md px-3 py-1.5 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={p.burst} onChange={e=>upd(i,'burst',+e.target.value)} /></td>
                      <td className="py-2 px-4"><input type="number" min={1} className="w-20 bg-black/50 border border-white/10 rounded-md px-3 py-1.5 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={p.priority} onChange={e=>upd(i,'priority',+e.target.value)} /></td>
                      <td className="py-2 px-4"><span className={stateBadge(p.state)}>{p.state||'New'}</span></td>
                      <td className="py-2 px-4"><button onClick={()=>delProc(i)} className="p-1.5 text-red-500/80 hover:text-red-400 hover:bg-red-500/10 rounded transition"><Trash2 className="w-4 h-4"/></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <button onClick={addProc} className="mt-4 flex items-center gap-2 text-xs uppercase tracking-widest text-cyan-500 font-bold bg-cyan-500/10 hover:bg-cyan-500/20 px-4 py-2 rounded-lg transition border border-cyan-500/20">
              <Plus className="w-4 h-4"/> Add Process
            </button>
          </div>

          {/* Config + Metrics */}
          <div className="flex flex-col md:flex-row gap-6">
            <div className="flex-1 bg-[#161B22] p-6 rounded-2xl border border-white/5">
              <h3 className="text-[10px] uppercase tracking-widest text-gray-500 mb-4 font-bold">Configuration</h3>
              <div className="space-y-4">
                <div>
                  <label className="block text-xs text-gray-400 mb-2">Scheduling Algorithm</label>
                  <select className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={algo} onChange={e=>setAlgo(e.target.value)}>
                    {ALGOS.map(a=><option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
                {algo === 'RR' && <div>
                  <label className="block text-xs text-gray-400 mb-2">Time Quantum</label>
                  <input type="number" min={1} className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={quantum} onChange={e=>setQuantum(+e.target.value)} />
                </div>}
                <button onClick={simulate} className="w-full mt-2 flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-3 px-4 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all">
                  <Play className="w-4 h-4"/> RUN SIMULATION
                </button>
              </div>
            </div>

            {gantt.length > 0 && <div className="flex-1 bg-[#161B22] p-6 rounded-2xl border border-white/5 flex flex-col justify-center">
              <h3 className="text-[10px] uppercase tracking-widest text-gray-500 mb-4 font-bold">Metrics</h3>
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-black/40 border border-white/5 p-5 rounded-2xl flex flex-col items-center">
                  <span className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Avg Turnaround</span>
                  <span className="text-3xl font-mono text-cyan-400 mt-2">{avgTurn.toFixed(2)}<span className="text-base ml-1">ms</span></span>
                </div>
                <div className="bg-black/40 border border-white/5 p-5 rounded-2xl flex flex-col items-center">
                  <span className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Avg Waiting</span>
                  <span className="text-3xl font-mono text-emerald-400 mt-2">{avgWait.toFixed(2)}<span className="text-base ml-1">ms</span></span>
                </div>
              </div>
            </div>}
          </div>

          {/* Gantt + Stats */}
          {gantt.length > 0 && <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            {/* Playback controls */}
            <div className="flex items-center gap-3 bg-black/50 p-4 border border-white/5 rounded-xl mb-6">
              <button onClick={()=>{setTick(0);setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition" title="Reset"><RotateCcw className="w-4 h-4"/></button>
              <button onClick={()=>{setTick(t=>Math.max(0,t-1));setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition" title="Step back"><SkipBack className="w-4 h-4"/></button>
              <button onClick={()=>setPlaying(!playing)} className="p-3 bg-cyan-600 text-black hover:bg-cyan-500 rounded-full transition shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                {playing ? <Pause className="w-5 h-5"/> : <Play className="w-5 h-5"/>}
              </button>
              <button onClick={()=>{setTick(t=>Math.min(simMax,t+1));setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition" title="Step forward"><SkipFwd className="w-4 h-4"/></button>
              <div className="flex-1 bg-black/60 rounded-full h-3 border border-white/10 overflow-hidden">
                <div className="bg-gradient-to-r from-cyan-500 to-blue-500 h-full transition-all duration-300" style={{width:`${simMax?tick/simMax*100:0}%`}}/>
              </div>
              <span className="text-cyan-400 font-mono text-sm font-bold min-w-[80px] text-right">t = {tick}</span>
            </div>

            {/* Gantt chart */}
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-xs font-bold uppercase tracking-widest text-[#E0E6ED]">Gantt Chart</h3>
              <div className="flex gap-1 bg-black/50 p-1 rounded-lg border border-white/5">
                <button onClick={()=>setZoom(z=>Math.max(50,z-20))} className="px-3 py-1 text-xs text-gray-400 hover:text-cyan-400 hover:bg-white/5 rounded transition">−</button>
                <span className="px-3 py-1 text-xs font-mono text-cyan-500">{zoom}%</span>
                <button onClick={()=>setZoom(z=>Math.min(400,z+20))} className="px-3 py-1 text-xs text-gray-400 hover:text-cyan-400 hover:bg-white/5 rounded transition">+</button>
              </div>
            </div>
            <div className="overflow-x-auto pb-6 custom-scrollbar">
              <div style={{minWidth:`${zoom}%`}}>
                <div className="flex w-full h-12 bg-black border border-white/10 rounded-md overflow-hidden">
                  {visGantt.map((b,i)=>(
                    <div key={i} title={`${b.id}: ${b.start}→${b.end}`}
                         className={cn('flex items-center justify-center border-r border-white/20 font-bold text-sm transition-all', blockColor(b.id))}
                         style={{flexGrow: b.end - b.start}}>
                      {b.id}
                    </div>
                  ))}
                </div>
                <div className="relative h-5 text-[10px] text-gray-500 font-mono mt-1">
                  {visGantt.map((b,i)=>(
                    <span key={i} className="absolute" style={{left:`${b.end/simMax*100}%`}}>{b.end}</span>
                  ))}
                </div>
              </div>
            </div>

            {/* Stats table */}
            <table className="w-full text-left border-collapse text-sm">
              <thead>
                <tr className="border-b border-white/10 uppercase tracking-widest text-[10px] text-gray-500">
                  {['ID','Completion','Turnaround','Waiting'].map(h=><th key={h} className="py-3 px-4 font-semibold">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {stats.map((p,i)=>{
                  const done = p.completion !== undefined && p.completion <= tick;
                  return (
                    <tr key={i} className={cn('border-b border-white/5', done ? 'hover:bg-white/5' : 'opacity-30')}>
                      <td className="py-3 px-4 font-mono text-[#E0E6ED]">{p.id}</td>
                      <td className="py-3 px-4 font-mono text-cyan-400">{done ? p.completion : '—'}</td>
                      <td className="py-3 px-4 font-mono text-cyan-400">{done ? p.completion - p.arrival : '—'}</td>
                      <td className="py-3 px-4 font-mono text-emerald-400">{done ? p.completion - p.arrival - p.burst : '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PAGE REPLACEMENT
    ═══════════════════════════════════════════════════════════════════════ */
    function PageReplacement() {
      const [refStr, setRefStr]     = useState('0, 9, 0, 1, 8, 1, 8, 7, 8, 7, 1, 2, 8, 2, 7, 8, 2, 3, 8, 3');
      const [frames, setFrames]     = useState(3);
      const [algo, setAlgo]         = useState('FIFO');
      const [steps, setSteps]       = useState([]);
      const [numFaults, setNumFaults] = useState(0);
      const [step, setStep]         = useState(0);
      const [playing, setPlaying]   = useState(false);

      useEffect(() => {
        let iv;
        if (playing && step < steps.length) { iv = setInterval(() => setStep(s => s+1), 750); }
        else if (step >= steps.length) setPlaying(false);
        return () => clearInterval(iv);
      }, [playing, step, steps.length]);

      const simulate = () => {
        const refs = refStr.split(/[,\s]+/).map(x=>x.trim()).filter(Boolean).map(Number);
        let fr = Array(frames).fill(null), _s = [], faults = 0;
        let lastUsed = {}, clockBits = Array(frames).fill(0), clockPtr = 0, t = 0;
        for (const r of refs) {
          t++;
          const hi = fr.indexOf(r), hit = hi !== -1;
          let replaced = null, reason = '';
          if (hit) {
            if (algo === 'LRU') lastUsed[r] = t;
            if (algo === 'Clock') clockBits[hi] = 1;
            reason = `Page ${r} already in memory.`;
          } else {
            faults++;
            const ei = fr.indexOf(null);
            if (ei !== -1) {
              fr[ei] = r;
              if (algo === 'LRU') lastUsed[r] = t;
              if (algo === 'Clock') clockBits[ei] = 1;
              reason = `Loaded into empty frame ${ei+1}.`;
            } else {
              let vi = -1;
              if (algo === 'FIFO') {
                const loadAt = fr.map(f => { const idx = [..._s].reverse().findIndex(s => s.page===f && !s.hit && s.replaced!==f); return idx === -1 ? -1 : _s.length-1-idx; });
                vi = loadAt.indexOf(Math.min(...loadAt));
                reason = `Page ${fr[vi]} loaded earliest (FIFO).`;
              } else if (algo === 'LRU') {
                const use = fr.map(f => lastUsed[f]||0);
                vi = use.indexOf(Math.min(...use));
                reason = `Page ${fr[vi]} least recently used.`;
              } else if (algo === 'Optimal') {
                const nextUse = fr.map(f => refs.indexOf(f, t));
                const neverUsed = nextUse.findIndex(n => n === -1);
                if (neverUsed !== -1) { vi = neverUsed; reason = `Page ${fr[vi]} never used again.`; }
                else { vi = nextUse.indexOf(Math.max(...nextUse)); reason = `Page ${fr[vi]} used farthest in future.`; }
              } else if (algo === 'Clock') {
                while (true) { if (clockBits[clockPtr]===0) { vi=clockPtr; clockPtr=(clockPtr+1)%frames; break; } else { clockBits[clockPtr]=0; clockPtr=(clockPtr+1)%frames; } }
                reason = `Clock hand → Page ${fr[vi]} (use bit 0).`;
              }
              replaced = fr[vi];
              fr[vi] = r;
              if (algo === 'LRU') lastUsed[r] = t;
              if (algo === 'Clock') clockBits[vi] = 1;
            }
          }
          _s.push({page:r, frames:[...fr], hit, replaced, reason});
        }
        setSteps(_s); setNumFaults(faults); setStep(0); setPlaying(true);
      };

      const vis = steps.slice(0, step);
      const hits = vis.filter(s=>s.hit).length;
      const faultsShown = vis.length - hits;
      const active = vis.length ? vis[vis.length-1] : null;

      return (
        <div className="space-y-6">
          <div className="bg-[#161B22] p-6 rounded-2xl border border-white/5">
            <h3 className="text-[10px] uppercase tracking-widest text-gray-500 mb-4 font-bold">Configuration</h3>
            <div className="flex flex-col md:flex-row gap-4">
              <div className="flex-1">
                <label className="block text-xs text-gray-400 mb-2">Reference String</label>
                <input type="text" className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors" value={refStr} onChange={e=>setRefStr(e.target.value)} />
              </div>
              <div className="w-28">
                <label className="block text-xs text-gray-400 mb-2">Frames</label>
                <input type="number" min={1} max={8} className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors" value={frames} onChange={e=>setFrames(+e.target.value)} />
              </div>
              <div className="w-44">
                <label className="block text-xs text-gray-400 mb-2">Algorithm</label>
                <select className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={algo} onChange={e=>setAlgo(e.target.value)}>
                  {['FIFO','LRU','Optimal','Clock'].map(a=><option key={a}>{a}</option>)}
                </select>
              </div>
              <div className="flex items-end">
                <button onClick={simulate} className="flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-2 px-6 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all">
                  <Play className="w-4 h-4"/> RUN
                </button>
              </div>
            </div>
          </div>

          {steps.length > 0 && <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-sm font-semibold text-[#E0E6ED]">Simulation — {algo}</h3>
              <div className="flex gap-3">
                <div className="px-4 py-2 bg-green-500/10 text-green-400 font-mono font-bold rounded-lg border border-green-500/20">Hits: {hits}</div>
                <div className="px-4 py-2 bg-red-500/10 text-red-400 font-mono font-bold rounded-lg border border-red-500/20">Faults: {faultsShown}/{numFaults}</div>
              </div>
            </div>

            {active && <div className={cn('mb-4 p-4 rounded-xl border flex items-start gap-3', active.hit ? 'bg-green-900/20 border-green-500/30 text-green-400' : 'bg-red-900/20 border-red-500/30 text-red-400')}>
              <span className="font-mono text-base font-bold border-r border-current pr-3 mt-0.5">{active.hit ? 'HIT' : 'FAULT'}</span>
              <div className="text-sm">
                {active.hit
                  ? <span>Page <strong className="text-white">{active.page}</strong> found in memory.</span>
                  : active.replaced !== null
                    ? <><span>Page <strong className="text-white">{active.page}</strong> loaded → replaced <strong className="text-white line-through opacity-60">{active.replaced}</strong>.</span><em className="block text-xs opacity-80 mt-1">{active.reason}</em></>
                    : <span>Page <strong className="text-white">{active.page}</strong> into empty frame.</span>
                }
              </div>
            </div>}

            <div className="flex items-center gap-3 bg-black/50 p-4 border border-white/5 rounded-xl mb-5">
              <button onClick={()=>{setStep(0);setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition"><RotateCcw className="w-4 h-4"/></button>
              <button onClick={()=>{setStep(s=>Math.max(0,s-1));setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition"><SkipBack className="w-4 h-4"/></button>
              <button onClick={()=>setPlaying(!playing)} className="p-3 bg-cyan-600 text-black hover:bg-cyan-500 rounded-full transition">
                {playing ? <Pause className="w-5 h-5"/> : <Play className="w-5 h-5"/>}
              </button>
              <button onClick={()=>{setStep(s=>Math.min(steps.length,s+1));setPlaying(false);}} className="p-2 text-cyan-500 hover:bg-cyan-500/20 rounded-lg transition"><SkipFwd className="w-4 h-4"/></button>
              <div className="flex-1 bg-black/60 rounded-full h-3 border border-white/10 overflow-hidden">
                <div className="bg-gradient-to-r from-cyan-500 to-blue-500 h-full transition-all" style={{width:`${steps.length?step/steps.length*100:0}%`}}/>
              </div>
              <span className="font-mono text-sm text-cyan-400 font-bold min-w-[70px] text-right">{step}/{steps.length}</span>
            </div>

            <div className="overflow-x-auto pb-4 custom-scrollbar">
              <table className="w-max text-center border-collapse">
                <thead>
                  <tr>
                    <th className="py-2 px-4 border-r border-white/10 text-xs font-mono text-cyan-500/70 sticky left-0 bg-[#161B22] z-10 whitespace-nowrap">Ref →</th>
                    {steps.map((s,i)=>(
                      <th key={i} className={cn('py-2 px-3 min-w-[2.5rem] font-mono text-sm border-b transition-all',
                        i===step-1 ? 'text-white bg-cyan-500/20 border-cyan-500/50' :
                        i>=step ? 'text-gray-600 border-white/5 opacity-40' : 'text-cyan-400/80 border-white/10'
                      )}>{s.page}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {Array.from({length:frames}).map((_,fi)=>(
                    <tr key={fi}>
                      <td className="py-3 px-4 border-r border-b border-white/5 text-[10px] uppercase font-bold text-gray-500 tracking-wider sticky left-0 bg-[#161B22] z-10 whitespace-nowrap">Fr {fi+1}</td>
                      {steps.map((s,i)=>{
                        if (i>=step) return <td key={i} className="py-2 px-2 border-b border-white/5 opacity-25"><div className="w-9 h-9 border border-dashed border-white/10 rounded mx-auto"/></td>;
                        const isNew = i===step-1 && (!s.hit) && (s.replaced===s.frames[fi] || (s.replaced===null && s.frames[fi]===s.page));
                        const isHit = i===step-1 && s.hit && s.frames[fi]===s.page;
                        return (
                          <td key={i} className="py-2 px-2 border-b border-white/5">
                            <div className={cn('mx-auto w-9 h-9 flex items-center justify-center rounded-lg border font-mono text-sm transition-all',
                              s.frames[fi]!==null
                                ? isNew ? 'bg-red-500/20 border-red-500 text-white'
                                : isHit ? 'bg-green-500/20 border-green-500 text-white'
                                : 'bg-white/5 border-cyan-500/30 text-[#E0E6ED]'
                                : 'bg-transparent border-dashed border-white/5 text-transparent'
                            )}>{s.frames[fi]!==null ? s.frames[fi] : '·'}</div>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                  <tr>
                    <td className="py-2 px-4 border-r border-white/10 text-[10px] uppercase font-bold text-gray-500 sticky left-0 bg-[#161B22] z-10">F/H</td>
                    {steps.map((s,i)=>i>=step ? <td key={i}/> : (
                      <td key={i} className="py-2 px-2">
                        <div className={cn('w-4 h-4 rounded-sm border mx-auto', s.hit ? 'bg-green-500/40 border-green-500' : 'bg-red-500/40 border-red-500')}/>
                      </td>
                    ))}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       BUDDY SYSTEM
    ═══════════════════════════════════════════════════════════════════════ */
    function BuddySystem() {
      const [totalMem, setTotalMem] = useState(1024);
      const [blocks, setBlocks]     = useState([{id:'r', size:1024, start:0, free:true, proc:null, alloc:0}]);
      const [reqSize, setReqSize]   = useState(200);
      const [reqProc, setReqProc]   = useState('P1');
      const [log, setLog]           = useState([]);

      const reset = () => {
        setBlocks([{id:'r', size:totalMem, start:0, free:true, proc:null, alloc:0}]);
        setLog([]);
      };

      const allocate = () => {
        if (reqSize<=0||reqSize>totalMem){alert('Invalid size');return;}
        const T = Math.pow(2, Math.ceil(Math.log2(Math.max(reqSize,1))));
        let cands = blocks.filter(b=>b.free&&b.size>=T);
        if (!cands.length){alert('Out of Memory');return;}
        cands.sort((a,b)=>(a.size-b.size)||(a.start-b.start));
        let nb=[...blocks], idx=nb.findIndex(b=>b.id===cands[0].id);
        while(nb[idx].size>T){
          const {size,start}=nb[idx], h=size/2;
          const id1=Math.random().toString(36).slice(2), id2=Math.random().toString(36).slice(2);
          nb.splice(idx,1,{id:id1,size:h,start,free:true,proc:null,alloc:0},{id:id2,size:h,start:start+h,free:true,proc:null,alloc:0});
        }
        nb[idx]={...nb[idx],free:false,alloc:reqSize,proc:reqProc};
        setBlocks(nb);
        setLog(l=>[...l,`+ Allocated ${reqSize}KB (block ${T}KB) → ${reqProc}`]);
      };

      const free = pid => {
        let nb=blocks.map(b=>b.proc===pid?{...b,free:true,proc:null,alloc:0}:{...b});
        let merged=true, mc=0;
        while(merged){
          merged=false;
          for(let i=0;i<nb.length-1;i++){
            if(nb[i].free&&nb[i+1].free&&nb[i].size===nb[i+1].size&&nb[i].start%(nb[i].size*2)===0){
              nb.splice(i,2,{id:Math.random().toString(36).slice(2),size:nb[i].size*2,start:nb[i].start,free:true,proc:null,alloc:0});
              merged=true;mc++;break;
            }
          }
        }
        setBlocks(nb);
        setLog(l=>[...l,`− Freed ${pid}. Coalesced ${mc}×`]);
      };

      const activeProcs = [...new Set(blocks.filter(b=>b.proc).map(b=>b.proc))];

      return (
        <div className="space-y-6">
          <div className="flex flex-col lg:flex-row gap-6">
            <div className="flex-1 bg-[#161B22] p-6 rounded-2xl border border-white/5">
              <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">Request Memory</h3>
              <div className="space-y-4">
                <div className="flex gap-4">
                  <div className="flex-1">
                    <label className="block text-xs text-gray-400 mb-2">Process ID</label>
                    <input className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors" value={reqProc} onChange={e=>setReqProc(e.target.value)} />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs text-gray-400 mb-2">Size (KB)</label>
                    <input type="number" className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors" value={reqSize} onChange={e=>setReqSize(+e.target.value)} />
                  </div>
                </div>
                <button onClick={allocate} className="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-2 px-4 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all uppercase tracking-wider text-xs">Allocate Memory</button>
                <hr className="border-white/10"/>
                <div className="flex gap-4 items-end">
                  <div className="flex-1">
                    <label className="block text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-2">Total Memory</label>
                    <select className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors" value={totalMem} onChange={e=>setTotalMem(+e.target.value)}>
                      {[256,512,1024,2048,4096].map(s=><option key={s} value={s}>{s} KB</option>)}
                    </select>
                  </div>
                  <button onClick={reset} className="bg-red-500/10 text-red-400 border border-red-500/20 py-2 px-4 rounded-md hover:bg-red-500/20 transition uppercase text-xs font-bold">Reset</button>
                </div>
              </div>
            </div>

            <div className="w-full lg:w-72 bg-black/40 p-6 rounded-2xl border border-white/5">
              <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">Active Processes</h3>
              {!activeProcs.length
                ? <p className="text-gray-500/50 text-xs italic">No processes allocated.</p>
                : <ul className="space-y-2">
                    {activeProcs.map(p=>(
                      <li key={p} className="flex justify-between items-center p-3 bg-white/5 rounded-lg border border-white/5 hover:border-cyan-500/30 group transition-colors">
                        <span className="font-mono text-cyan-400">{p}</span>
                        <button onClick={()=>free(p)} className="text-gray-500 hover:text-red-400 p-1.5 rounded border border-white/5 hover:border-red-500/30 bg-black/50 transition-all opacity-0 group-hover:opacity-100"><Trash2 className="w-3.5 h-3.5"/></button>
                      </li>
                    ))}
                  </ul>
              }
            </div>
          </div>

          <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">Memory Visualization</h3>
            <div className="flex w-full h-28 border border-white/10 rounded-xl overflow-hidden bg-[#0A0B10]">
              {blocks.map(b=>(
                <div key={b.id}
                     className={cn('flex flex-col items-center justify-center border-r border-black/50 text-[10px] px-1 overflow-hidden transition-all duration-500 relative',
                       b.free ? 'bg-white/5 hover:bg-white/10' : 'bg-cyan-900/40 border-t border-t-cyan-500/50')}
                     style={{width:`${b.size/totalMem*100}%`}}>
                  {b.free
                    ? <span className="font-mono text-gray-500 leading-tight text-center">{b.size}K</span>
                    : <>
                        <span className="font-bold text-cyan-400 text-xs drop-shadow-[0_0_5px_rgba(6,182,212,0.8)] leading-tight">{b.proc}</span>
                        <span className="font-mono text-cyan-500/60 text-[9px]">{b.size}K</span>
                        {b.alloc<b.size && <span className="absolute bottom-1 px-1 bg-red-500/20 text-red-400 rounded text-[8px] border border-red-500/30">{b.size-b.alloc}K↗</span>}
                      </>
                  }
                </div>
              ))}
            </div>
          </div>

          <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">History</h3>
            <div className="max-h-40 overflow-y-auto space-y-1.5 text-xs font-mono text-gray-400/80 pr-2 custom-scrollbar">
              {!log.length && <span className="italic opacity-50">No operations yet.</span>}
              {log.map((h,i)=>(
                <div key={i} className="flex gap-3 border-b border-white/5 pb-1.5">
                  <span className="text-cyan-500/50 w-5 text-right shrink-0">{i+1}</span>
                  <span>{h}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ADDRESS TRANSLATION
    ═══════════════════════════════════════════════════════════════════════ */
    function AddressTranslation() {
      const [params, setParams]   = useState({addr:'1A2C', sizeKB:4});
      const [table, setTable]     = useState([
        {page:0, frame:3, valid:true},
        {page:1, frame:7, valid:true},
        {page:2, frame:0, valid:false},
        {page:3, frame:1, valid:true},
      ]);
      const [result, setResult]   = useState(null);

      const calc = () => {
        try {
          const logical = parseInt(params.addr, 16);
          if (isNaN(logical)) throw new Error('Invalid hex address');
          const psb = params.sizeKB * 1024;
          const ob = Math.log2(psb);
          if (!Number.isInteger(ob)) throw new Error('Page size must be power of 2');
          const offset = logical & ((1<<ob)-1);
          const pn = logical >> ob;
          const entry = table.find(e => e.page === pn);
          if (!entry||!entry.valid) setResult({ob, pn, offset, phex:null, err:`Page Fault! (page ${pn} invalid)`});
          else setResult({ob, pn, offset, phex:((entry.frame<<ob)|offset).toString(16).toUpperCase(), err:null});
        } catch(e) { setResult({ob:0,pn:0,offset:0,phex:null,err:e.message}); }
      };

      const upd = (i, f, v) => { const t=[...table]; t[i]={...t[i],[f]:v}; setTable(t); };

      /* Hierarchy node helper */
      const HierNode = ({icon, label, sub, val, active, colorClass}) => (
        <div className={cn('flex flex-col items-center p-5 rounded-2xl border z-10 w-full md:w-1/4 transition-all', active ? colorClass.wrap : 'bg-[#161B22] border-white/10 opacity-50')}>
          <div className={cn('w-12 h-12 rounded-full border flex items-center justify-center mb-3 relative', active ? colorClass.icon : 'bg-gray-500/10 border-gray-500/30 text-gray-500')}>
            {icon}
            <span className={cn('absolute -top-2 -right-4 text-white text-[9px] px-1.5 py-0.5 rounded-full font-mono', active ? colorClass.badge : 'bg-gray-600')}>{colorClass.speed}</span>
          </div>
          <span className="font-bold text-[#E0E6ED] text-sm">{label}</span>
          <span className="text-[10px] text-gray-500 uppercase mt-1 text-center">{sub}</span>
          <div className={cn('mt-3 px-3 py-1.5 bg-black/50 border rounded-lg font-mono text-xs text-center min-w-[80px]', active ? colorClass.val : 'border-white/5 text-gray-600')}>{val}</div>
        </div>
      );

      const maxFrame = Math.max(14, ...table.map(e=>e.frame));

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row gap-6">
            {/* Config + Result */}
            <div className="flex-1 space-y-6">
              <div className="bg-[#161B22] p-6 rounded-2xl border border-white/5">
                <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">Translation Parameters</h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-400 mb-2">Logical Address (Hex)</label>
                    <div className="flex bg-black/50 border border-white/10 rounded-md focus-within:border-cyan-500 transition-colors">
                      <span className="bg-white/5 px-3 py-2 text-gray-500 border-r border-white/10 rounded-l-md font-mono">0x</span>
                      <input type="text" className="bg-transparent px-3 py-2 w-full outline-none font-mono uppercase text-cyan-400"
                             value={params.addr} onChange={e=>setParams({...params, addr:e.target.value.toUpperCase()})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-400 mb-2">Page Size (KB)</label>
                    <select className="w-full bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 outline-none focus:border-cyan-500 transition-colors"
                            value={params.sizeKB} onChange={e=>setParams({...params, sizeKB:+e.target.value})}>
                      {[1,2,4,8,16,32,64].map(s=><option key={s} value={s}>{s} KB</option>)}
                    </select>
                  </div>
                  <button onClick={calc} className="w-full flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-3 px-4 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all mt-2">
                    <Play className="w-4 h-4"/> CALCULATE MAP
                  </button>
                </div>
              </div>

              {result && <div className="bg-black/40 p-6 rounded-2xl border border-white/5 border-l-4 border-l-cyan-500">
                <h3 className="text-[10px] uppercase tracking-widest text-[#E0E6ED] font-bold mb-4">Results</h3>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  {[['Offset Bits (d)',`${result.ob} bits`,'text-cyan-400'],['Page Num Bits',`${32-result.ob} bits`,'text-cyan-400'],['Page Number (p)',`0x${result.pn.toString(16).toUpperCase()}`,'text-purple-400'],['Offset (d)',`0x${result.offset.toString(16).toUpperCase()}`,'text-blue-400']].map(([l,v,c])=>(
                    <div key={l} className="bg-black/40 p-4 rounded-xl border border-white/5">
                      <span className="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">{l}</span>
                      <span className={cn('font-mono text-lg font-bold', c)}>{v}</span>
                    </div>
                  ))}
                </div>
                {result.err
                  ? <div className="p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl flex items-center gap-3"><AlertTriangle className="w-5 h-5 shrink-0"/><span>{result.err}</span></div>
                  : <div className="p-6 bg-cyan-900/20 border border-cyan-500/30 rounded-xl text-center">
                      <span className="block text-[10px] uppercase tracking-widest font-bold text-cyan-500 mb-2">Physical Address</span>
                      <span className="font-mono text-5xl block text-[#E0E6ED] tracking-wider">0x{result.phex}</span>
                    </div>
                }
              </div>}
            </div>

            {/* Page Table */}
            <div className="flex-1 bg-black/40 p-6 rounded-2xl border border-white/5 flex flex-col">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-xs uppercase tracking-widest text-[#E0E6ED] font-bold">Page Table</h3>
                <button onClick={()=>setTable([...table,{page:table.length, frame:0, valid:true}])}
                        className="flex items-center gap-1 px-4 py-2 bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 rounded-lg text-xs tracking-widest uppercase font-bold border border-cyan-500/20 transition">
                  <Plus className="w-4 h-4"/> ADD
                </button>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-white/10 uppercase tracking-widest text-[10px] text-gray-500">
                      {['Page','Frame','Valid',''].map(h=><th key={h} className="py-3 px-4 font-semibold">{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {table.map((e,i)=>(
                      <tr key={i} className="border-b border-white/5 hover:bg-white/5 transition">
                        <td className="py-3 px-4"><input type="number" className="w-16 bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors" value={e.page} onChange={x=>upd(i,'page',+x.target.value)} /></td>
                        <td className="py-3 px-4"><input type="number" className="w-16 bg-black/50 border border-white/10 rounded-md p-2 text-sm text-cyan-400 font-mono outline-none focus:border-cyan-500 transition-colors disabled:opacity-40" value={e.frame} onChange={x=>upd(i,'frame',+x.target.value)} disabled={!e.valid} /></td>
                        <td className="py-3 px-4">
                          <label className="flex items-center gap-2 cursor-pointer">
                            <div className="relative flex items-center">
                              <input type="checkbox" checked={e.valid} onChange={x=>upd(i,'valid',x.target.checked)} className="peer sr-only"/>
                              <div className="w-10 h-5 bg-white/10 rounded-full border border-white/10 peer-checked:bg-green-500/40 peer-checked:border-green-500/50 transition-colors"/>
                              <div className={cn('absolute left-1 top-1 w-3 h-3 rounded-full transition-transform', e.valid?'translate-x-5 bg-green-400':'bg-gray-400')}/>
                            </div>
                            <span className="text-xs font-mono text-gray-400">{e.valid?'1':'0'}</span>
                          </label>
                        </td>
                        <td className="py-3 px-4"><button onClick={()=>setTable(table.filter((_,j)=>j!==i))} className="p-1.5 text-red-500/80 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition"><Trash2 className="w-4 h-4"/></button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* Memory hierarchy */}
          {result && <div className="bg-black/40 p-8 rounded-2xl border border-white/5">
            <h3 className="text-xs uppercase tracking-widest text-[#E0E6ED] font-bold mb-8 text-center flex items-center justify-center gap-2">
              <Network className="w-4 h-4 text-cyan-500"/> Memory Hierarchy Flow
            </h3>
            <div className="flex flex-col md:flex-row items-stretch justify-between gap-4">
              <HierNode icon={<Cpu className="w-6 h-6"/>} label="CPU" sub="Logical Address" val={`0x${params.addr}`} active={true}
                colorClass={{wrap:'bg-blue-500/10 border-blue-500/30', icon:'bg-blue-500/20 border-blue-500/50 text-blue-400', badge:'bg-blue-600', speed:'~1ns', val:'border-blue-500/20 text-blue-400'}} />
              <HierNode icon={<Zap className="w-6 h-6"/>} label="TLB / Cache" sub="Fast Lookup" val={result.err?'TLB Miss':'TLB Hit'} active={true}
                colorClass={{wrap:result.err?'bg-red-500/10 border-red-500/30':'bg-purple-500/10 border-purple-500/30', icon:result.err?'bg-red-500/20 border-red-500/50 text-red-400':'bg-purple-500/20 border-purple-500/50 text-purple-400', badge:result.err?'bg-red-600':'bg-purple-600', speed:'~10ns', val:result.err?'border-red-500/20 text-red-400':'border-purple-500/20 text-purple-400'}} />
              <HierNode icon={<Database className="w-6 h-6"/>} label="Physical RAM" sub={result.err?'Page Fault':'Data Found'} val={result.err?'—':`0x${result.phex}`} active={!result.err}
                colorClass={{wrap:'bg-cyan-900/20 border-cyan-500/30', icon:'bg-cyan-500/20 border-cyan-500/50 text-cyan-400', badge:'bg-cyan-600', speed:'~100ns', val:'border-cyan-500/20 text-cyan-400'}} />
              <HierNode icon={<HardDrive className="w-6 h-6"/>} label="Disk (Swap)" sub={result.err?'Fetch Required':'Not Accessed'} val={result.err?`Page ${result.pn}`:'—'} active={!!result.err}
                colorClass={{wrap:'bg-amber-900/20 border-amber-500/30', icon:'bg-amber-500/20 border-amber-500/50 text-amber-400', badge:'bg-amber-600', speed:'~10ms!', val:'border-amber-500/20 text-amber-400'}} />
            </div>
          </div>}

          {/* Frame grid */}
          {result && <div className="bg-black/40 p-6 rounded-2xl border border-white/5">
            <h3 className="text-xs uppercase tracking-widest text-[#E0E6ED] font-bold mb-6 text-center flex items-center justify-center gap-2">
              <Database className="w-4 h-4 text-cyan-500"/> Physical Memory Frames
            </h3>
            <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-12 gap-2">
              {Array.from({length:maxFrame+1},(_,i)=>{
                const entry = table.find(e=>e.frame===i&&e.valid);
                const isTarget = !result.err && entry?.page === result.pn;
                return (
                  <div key={i} className={cn('p-3 rounded-lg border flex flex-col items-center justify-center transition-all',
                    isTarget ? 'bg-cyan-500/20 border-cyan-400 scale-110 shadow-[0_0_15px_rgba(6,182,212,0.4)]' :
                    entry ? 'bg-white/5 border-white/15' : 'bg-transparent border-dashed border-white/5'
                  )}>
                    <span className="text-[9px] text-gray-500 mb-0.5">F{i}</span>
                    <span className={cn('font-mono font-bold', isTarget?'text-cyan-300 text-base':'text-[#E0E6ED] text-sm')}>
                      {entry ? `P${entry.page}` : '—'}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ROOT APP
    ═══════════════════════════════════════════════════════════════════════ */
    function App() {
      const [tab, setTab] = useState('cpu');
      const navs = [
        {id:'cpu',   label:'CPU Scheduling',     icon:<Cpu   className="w-5 h-5"/>},
        {id:'page',  label:'Page Replacement',    icon:<Server className="w-5 h-5"/>},
        {id:'addr',  label:'Address Translation', icon:<Network className="w-5 h-5"/>},
        {id:'buddy', label:'Buddy System',        icon:<ShieldAlert className="w-5 h-5"/>},
      ];
      return (
        <div className="min-h-screen bg-[#0A0B10] flex flex-col md:flex-row text-[#E0E6ED]" style={{fontFamily:'ui-sans-serif,system-ui,sans-serif'}}>
          <aside className="w-full md:w-64 bg-[#0F111A] border-r border-white/5 flex flex-col md:min-h-screen sticky top-0 z-20 shadow-[4px_0_20px_rgba(0,0,0,0.4)]">
            <div className="p-6 border-b border-white/5 flex items-center gap-3">
              <div className="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center shadow-[0_0_15px_#06b6d4]">
                <Laptop className="w-6 h-6 text-black"/>
              </div>
              <div>
                <h1 className="font-bold text-lg leading-tight" style={{background:'linear-gradient(90deg,#22d3ee,#3b82f6)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>OS Simulator</h1>
                <span className="text-cyan-600 block text-xs tracking-widest uppercase">PRO</span>
              </div>
            </div>
            <nav className="flex-1 p-4 flex md:flex-col gap-2 overflow-x-auto">
              {navs.map(n=>(
                <button key={n.id} onClick={()=>setTab(n.id)}
                        className={cn('flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition whitespace-nowrap border',
                          tab===n.id ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.1)]' : 'text-gray-400 hover:bg-white/5 hover:text-white border-transparent')}>
                  {n.icon} {n.label}
                </button>
              ))}
            </nav>
          </aside>
          <main className="flex-1 p-4 md:p-8 overflow-y-auto">
            <div className="max-w-6xl mx-auto">
              <header className="mb-8">
                <h2 className="text-2xl font-bold text-[#E0E6ED] border-b border-white/10 pb-4">
                  {navs.find(n=>n.id===tab)?.label}
                </h2>
              </header>
              {tab==='cpu'   && <CPUScheduling/>}
              {tab==='page'  && <PageReplacement/>}
              {tab==='addr'  && <AddressTranslation/>}
              {tab==='buddy' && <BuddySystem/>}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
